# GER LoRA on the local Qwen: .venv-gf/bin/python -m mlx_lm lora -c training/ger_lora.yaml
model: models/Qwen2.5-3B-Instruct-4bit
train: true
data: models/ger/data
adapter_path: models/ger/lora
fine_tune_type: lora
mask_prompt: true
num_layers: 16
lora_parameters:
  rank: 8
  scale: 16.0
  dropout: 0.05
  keys: ["self_attn.q_proj", "self_attn.k_proj", "self_attn.v_proj", "self_attn.o_proj"]
optimizer: adamw
optimizer_config:
  adamw: {weight_decay: 0.01}
batch_size: 4
iters: 600
lr_schedule:
  name: cosine_decay
  warmup: 30
  warmup_init: 1.0e-6
  arguments: [1.0e-4, 570, 1.0e-5]
val_batches: -1
steps_per_report: 10
steps_per_eval: 50
save_every: 50
max_seq_length: 640
seed: 0
